<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Lenjer Kecil">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#E9DEC9"/>
    </radialGradient>
    <linearGradient id="miniSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1C274"/>
      <stop offset="55%" stop-color="#D3943E"/>
      <stop offset="100%" stop-color="#A36420"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#28160C" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Oval Ceramic Platter -->
  <ellipse cx="400" cy="256" rx="285" ry="168" fill="#FFFDF9" filter="url(#sh)" stroke="#DCCFB9" stroke-width="3"/>
  <ellipse cx="400" cy="256" rx="242" ry="134" fill="none" stroke="#E9DEC9" stroke-width="2"/>

  <!-- 5 Neat Mini Lenjer Kecil Cylinders -->
  <g filter="url(#sh)">
    <g transform="translate(212 192) rotate(-12)">
      <rect x="0" y="0" width="152" height="44" rx="22" fill="url(#miniSkin)"/>
      <path d="M22 12 H126" stroke="#FCE3AE" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g transform="translate(384 170) rotate(8)">
      <rect x="0" y="0" width="152" height="44" rx="22" fill="url(#miniSkin)"/>
      <path d="M22 12 H126" stroke="#FCE3AE" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g transform="translate(264 252) rotate(-4)">
      <rect x="0" y="0" width="158" height="46" rx="23" fill="url(#miniSkin)"/>
      <path d="M22 12 H130" stroke="#FCE3AE" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g transform="translate(428 242) rotate(14)">
      <rect x="0" y="0" width="152" height="44" rx="22" fill="url(#miniSkin)"/>
      <path d="M22 12 H126" stroke="#FCE3AE" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
    <g transform="translate(316 312) rotate(3)">
      <rect x="0" y="0" width="156" height="45" rx="22.5" fill="url(#miniSkin)"/>
      <path d="M22 12 H128" stroke="#FCE3AE" stroke-width="3.5" stroke-linecap="round" opacity="0.5"/>
    </g>
  </g>

  <!-- Ebi Powder & Cuko Accents -->
  <g transform="translate(216 314)">
    <circle cx="0" cy="0" r="24" fill="#F2DEC1" stroke="#D8BF9B" stroke-width="1.5"/>
    <circle cx="-6" cy="-4" r="3" fill="#C97336"/>
    <circle cx="5" cy="-6" r="2.5" fill="#B55B24"/>
    <circle cx="8" cy="5" r="3" fill="#D48445"/>
    <circle cx="-4" cy="7" r="2.5" fill="#B55B24"/>
    <circle cx="1" cy="1" r="3" fill="#C97336"/>
  </g>
  <g transform="translate(566 322)">
    <rect x="0" y="0" width="20" height="18" rx="4" fill="#B2DC8C" stroke="#5A8E3D" stroke-width="2"/>
    <rect x="24" y="-6" width="20" height="18" rx="4" fill="#9BC973" stroke="#5A8E3D" stroke-width="2"/>
  </g>
</svg>

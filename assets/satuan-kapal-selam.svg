<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Kapal Selam Besar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#EAE0D0"/>
    </radialGradient>
    <radialGradient id="plate" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="82%" stop-color="#F2E8D8"/>
      <stop offset="100%" stop-color="#DDD0BC"/>
    </radialGradient>
    <linearGradient id="crust" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7B15E"/>
      <stop offset="55%" stop-color="#CD8B38"/>
      <stop offset="100%" stop-color="#9E5E1D"/>
    </linearGradient>
    <radialGradient id="dough" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#F8F0DF"/>
      <stop offset="100%" stop-color="#E2D1B3"/>
    </radialGradient>
    <radialGradient id="yolk" cx="38%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE169"/>
      <stop offset="65%" stop-color="#F2B422"/>
      <stop offset="100%" stop-color="#D48C10"/>
    </radialGradient>
    <radialGradient id="cuko" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A2512"/>
      <stop offset="100%" stop-color="#210E06"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2B180E" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Subtle Songket corner band -->
  <path d="M0 0 H210 L140 70 H0 Z" fill="#7D1E26" opacity="0.12"/>
  <path d="M26 24 L38 14 L50 24 L38 34 Z M66 24 L78 14 L90 24 L78 34 Z M106 24 L118 14 L130 24 L118 34 Z" fill="#B8862E" opacity="0.35"/>

  <!-- Ceramic Plate -->
  <ellipse cx="375" cy="272" rx="260" ry="170" fill="url(#plate)" filter="url(#sh)" stroke="#D9CBB5" stroke-width="2"/>
  <ellipse cx="375" cy="272" rx="205" ry="130" fill="none" stroke="#E4D7C3" stroke-width="1.5"/>

  <!-- Back Half of Kapal Selam -->
  <g transform="translate(265 255) rotate(-14)" filter="url(#sh)">
    <path d="M-98 20 C-95 -52 -42 -96 14 -92 C72 -88 106 -38 102 22 C98 68 54 90 -8 90 C-68 90 -100 66 -98 20 Z" fill="url(#crust)"/>
    <path d="M-82 18 C-79 -38 -36 -74 12 -71 C58 -68 85 -28 82 20 C79 56 44 74 -6 74 C-54 74 -84 55 -82 18 Z" fill="url(#dough)"/>
    <ellipse cx="6" cy="8" rx="46" ry="42" fill="#FFFDF8"/>
    <circle cx="8" cy="10" r="26" fill="url(#yolk)"/>
  </g>

  <!-- Front Half of Kapal Selam -->
  <g transform="translate(435 280) rotate(12)" filter="url(#sh)">
    <path d="M-104 22 C-100 -54 -44 -98 16 -94 C76 -90 110 -38 106 24 C102 72 56 94 -8 94 C-72 94 -106 70 -104 22 Z" fill="url(#crust)"/>
    <path d="M-86 20 C-82 -38 -36 -76 14 -72 C62 -69 88 -26 85 22 C82 58 46 76 -6 76 C-56 76 -88 57 -86 20 Z" fill="url(#dough)"/>
    <ellipse cx="8" cy="10" rx="48" ry="44" fill="#FFFDF8"/>
    <circle cx="10" cy="12" r="28" fill="url(#yolk)"/>
    <!-- Glossy Cuko Drizzle -->
    <path d="M-24 -68 C-10 -30 16 -12 22 30 C26 52 16 74 4 86" fill="none" stroke="#3B1A0B" stroke-width="11" stroke-linecap="round" opacity="0.88"/>
    <path d="M-22 -66 C-10 -30 14 -12 20 28" fill="none" stroke="#804724" stroke-width="2.5" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- Diced Green Cucumber -->
  <g transform="translate(225 340)">
    <rect x="0" y="0" width="24" height="22" rx="4" fill="#A6D47F" stroke="#5E9440" stroke-width="2"/>
    <rect x="28" y="-8" width="24" height="22" rx="4" fill="#B7DF92" stroke="#5E9440" stroke-width="2"/>
    <rect x="16" y="18" width="24" height="22" rx="4" fill="#9BC973" stroke="#5E9440" stroke-width="2"/>
    <rect x="48" y="10" width="24" height="22" rx="4" fill="#B2DC8C" stroke="#5E9440" stroke-width="2"/>
  </g>

  <!-- Small Cuko Dipping Bowl -->
  <g transform="translate(650 155)" filter="url(#sh)">
    <circle cx="0" cy="0" r="66" fill="#3B2920"/>
    <circle cx="0" cy="-2" r="56" fill="url(#cuko)"/>
    <circle cx="-16" cy="-14" r="4" fill="#C9452C" opacity="0.85"/>
    <circle cx="14" cy="-6" r="3.5" fill="#7EA13D" opacity="0.85"/>
    <circle cx="-4" cy="14" r="3" fill="#F2D7A5" opacity="0.7"/>
    <path d="M-36 -24 A44 44 0 0 1 16 -40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>

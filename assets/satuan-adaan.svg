<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Adaan Bulat">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FCF7EE"/>
      <stop offset="100%" stop-color="#E7DBC7"/>
    </radialGradient>
    <radialGradient id="adaanBall" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#EBB562"/>
      <stop offset="55%" stop-color="#C88430"/>
      <stop offset="100%" stop-color="#8F5116"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#28160C" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Handcrafted Dark Rim Plate -->
  <ellipse cx="385" cy="264" rx="250" ry="165" fill="#F8F2E7" filter="url(#sh)" stroke="#6C4B36" stroke-width="6"/>
  <ellipse cx="385" cy="264" rx="224" ry="142" fill="none" stroke="#DECBB0" stroke-width="1.5"/>

  <!-- 4 Plump Round Pempek Adaan with Scallion & Shallot Flecks -->
  <g filter="url(#sh)">
    <!-- Back Left -->
    <g transform="translate(310 212)">
      <circle cx="0" cy="0" r="64" fill="url(#adaanBall)"/>
      <ellipse cx="-18" cy="-16" rx="7" ry="3" transform="rotate(-20 -18 -16)" fill="#4D7C35"/>
      <ellipse cx="20" cy="-6" rx="6" ry="3" transform="rotate(35 20 -6)" fill="#4D7C35"/>
      <ellipse cx="-6" cy="22" rx="7" ry="3" transform="rotate(12 -6 22)" fill="#7A3415" opacity="0.65"/>
      <ellipse cx="12" cy="18" rx="6" ry="2.5" transform="rotate(-30 12 18)" fill="#588B3E"/>
    </g>
    <!-- Back Right -->
    <g transform="translate(448 214)">
      <circle cx="0" cy="0" r="64" fill="url(#adaanBall)"/>
      <ellipse cx="-16" cy="10" rx="7" ry="3" transform="rotate(25 -16 10)" fill="#4D7C35"/>
      <ellipse cx="18" cy="-14" rx="6" ry="3" transform="rotate(-15 18 -14)" fill="#588B3E"/>
      <ellipse cx="4" cy="24" rx="7" ry="3" fill="#7A3415" opacity="0.6"/>
      <ellipse cx="-6" cy="-22" rx="6" ry="2.5" transform="rotate(40 -6 -22)" fill="#4D7C35"/>
    </g>
    <!-- Front Left -->
    <g transform="translate(324 316)">
      <circle cx="0" cy="0" r="66" fill="url(#adaanBall)"/>
      <ellipse cx="-22" cy="-8" rx="7" ry="3" transform="rotate(15 -22 -8)" fill="#4D7C35"/>
      <ellipse cx="16" cy="-20" rx="6" ry="3" transform="rotate(-35 16 -20)" fill="#588B3E"/>
      <ellipse cx="14" cy="16" rx="7" ry="3" transform="rotate(20 14 16)" fill="#4D7C35"/>
      <ellipse cx="-10" cy="24" rx="6" ry="3" fill="#7A3415" opacity="0.6"/>
    </g>
    <!-- Front Right -->
    <g transform="translate(464 312)">
      <circle cx="0" cy="0" r="66" fill="url(#adaanBall)"/>
      <ellipse cx="-18" cy="-18" rx="7" ry="3" transform="rotate(-25 -18 -18)" fill="#588B3E"/>
      <ellipse cx="22" cy="6" rx="7" ry="3" transform="rotate(30 22 6)" fill="#4D7C35"/>
      <ellipse cx="-4" cy="16" rx="6" ry="3" transform="rotate(-10 -4 16)" fill="#4D7C35"/>
      <ellipse cx="10" cy="-22" rx="6" ry="2.5" fill="#7A3415" opacity="0.6"/>
    </g>
  </g>

  <!-- Side Cuko Dipping Saucer -->
  <g transform="translate(652 342)" filter="url(#sh)">
    <circle cx="0" cy="0" r="62" fill="#3B251B"/>
    <circle cx="0" cy="-2" r="52" fill="#2A1208"/>
    <circle cx="-14" cy="-10" r="3.5" fill="#C9452C"/>
    <circle cx="12" cy="8" r="3" fill="#7EA13D"/>
    <path d="M-30 -20 A38 38 0 0 1 16 -34" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" opacity="0.22"/>
  </g>
</svg>

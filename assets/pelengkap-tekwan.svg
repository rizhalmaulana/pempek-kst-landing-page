<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Tekwan Frozen Komplit 3 Porsi">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FBF6EE"/>
      <stop offset="100%" stop-color="#E7DAC6"/>
    </radialGradient>
    <radialGradient id="broth" cx="45%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#F5DFB0"/>
      <stop offset="65%" stop-color="#DFB874"/>
      <stop offset="100%" stop-color="#BA8E4A"/>
    </radialGradient>
    <radialGradient id="pentol" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFDF8"/>
      <stop offset="100%" stop-color="#E5D5BA"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#28160C" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Steam Wisps -->
  <path d="M342 82 Q332 56 348 34 M400 72 Q390 46 406 24 M458 84 Q448 58 464 36" fill="none" stroke="#C5B299" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- Handcrafted Dark Ceramic Bowl -->
  <circle cx="400" cy="264" r="196" fill="#3B261C" filter="url(#sh)" stroke="#5B3F31" stroke-width="5"/>
  <circle cx="400" cy="264" r="172" fill="url(#broth)"/>

  <!-- Delicate White Soun Glass Noodles -->
  <path d="M262 246 Q332 204 402 254 T536 248 M274 294 Q354 256 426 306 T522 288 M296 206 Q388 184 484 218" fill="none" stroke="#FFFDF8" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>

  <!-- Bengkuang Strips -->
  <g stroke="#FAF4E6" stroke-width="5" stroke-linecap="round">
    <line x1="300" y1="310" x2="344" y2="330"/>
    <line x1="312" y1="324" x2="352" y2="342"/>
    <line x1="464" y1="202" x2="500" y2="220"/>
  </g>

  <!-- Plump Ivory Pentol Ikan Tekwan -->
  <g filter="url(#sh)">
    <path d="M312 222 C314 196 346 186 364 202 C380 218 370 250 344 252 C320 254 310 240 312 222 Z" fill="url(#pentol)"/>
    <path d="M404 196 C412 174 446 172 460 194 C472 214 456 240 432 238 C408 236 396 216 404 196 Z" fill="url(#pentol)"/>
    <path d="M352 286 C356 262 390 254 408 272 C424 290 412 320 384 322 C358 324 348 308 352 286 Z" fill="url(#pentol)"/>
    <path d="M446 274 C452 250 484 244 502 264 C518 282 504 312 478 314 C452 316 440 296 446 274 Z" fill="url(#pentol)"/>
    <path d="M286 276 C290 254 320 248 334 266 C348 284 334 308 312 310 C290 312 282 294 286 276 Z" fill="url(#pentol)"/>
    <path d="M398 346 C404 324 436 320 450 338 C464 356 450 380 426 382 C402 384 392 366 398 346 Z" fill="url(#pentol)"/>
  </g>

  <!-- Dark Wood-Ear Mushrooms (Jamur Kuping) -->
  <path d="M372 222 C390 214 404 234 390 248 C378 258 358 242 372 222 Z" fill="#3B2318"/>
  <path d="M484 232 C504 226 516 244 502 258 C490 268 472 250 484 232 Z" fill="#3B2318"/>
  <path d="M324 338 C344 332 358 352 342 366 C328 376 312 356 324 338 Z" fill="#3B2318"/>

  <!-- Sliced Green Scallions & Fried Shallots -->
  <g fill="#4D8435">
    <circle cx="386" cy="264" r="6"/>
    <circle cx="434" cy="252" r="5.5"/>
    <circle cx="352" cy="244" r="5"/>
    <circle cx="452" cy="322" r="6"/>
    <circle cx="322" cy="248" r="5"/>
  </g>
  <g fill="#9E5720">
    <ellipse cx="412" cy="274" rx="7" ry="3" transform="rotate(24 412 274)"/>
    <ellipse cx="368" cy="316" rx="7" ry="3" transform="rotate(-18 368 316)"/>
    <ellipse cx="472" cy="272" rx="6" ry="3" transform="rotate(35 472 272)"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Lenjer Besar">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#FAF4EA"/>
      <stop offset="100%" stop-color="#E7DACA"/>
    </radialGradient>
    <linearGradient id="board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A67449"/>
      <stop offset="50%" stop-color="#8B5C34"/>
      <stop offset="100%" stop-color="#6B4323"/>
    </linearGradient>
    <linearGradient id="lenjerSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0C070"/>
      <stop offset="55%" stop-color="#D49540"/>
      <stop offset="100%" stop-color="#A76822"/>
    </linearGradient>
    <radialGradient id="cutFace" cx="45%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#FAF3E5"/>
      <stop offset="100%" stop-color="#E4D2B3"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#28160C" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Wooden Serving Board -->
  <rect x="92" y="106" width="616" height="300" rx="34" fill="url(#board)" filter="url(#sh)"/>
  <rect x="108" y="122" width="584" height="268" rx="24" fill="none" stroke="#C5976B" stroke-width="2" opacity="0.45"/>

  <!-- Whole Jumbo Lenjer Log -->
  <g transform="translate(150 182) rotate(-7)" filter="url(#sh)">
    <rect x="0" y="0" width="320" height="86" rx="43" fill="url(#lenjerSkin)"/>
    <ellipse cx="304" cy="43" rx="20" ry="38" fill="url(#cutFace)" stroke="#C28132" stroke-width="4"/>
    <path d="M40 20 H255" stroke="#FCE0A6" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Diagonal Thick Slices -->
  <g filter="url(#sh)">
    <g transform="translate(468 258) rotate(-14)">
      <rect x="0" y="0" width="76" height="88" rx="28" fill="url(#lenjerSkin)"/>
      <ellipse cx="56" cy="44" rx="22" ry="39" fill="url(#cutFace)" stroke="#BD7B2C" stroke-width="4"/>
    </g>
    <g transform="translate(534 274) rotate(-10)">
      <rect x="0" y="0" width="76" height="88" rx="28" fill="url(#lenjerSkin)"/>
      <ellipse cx="56" cy="44" rx="22" ry="39" fill="url(#cutFace)" stroke="#BD7B2C" stroke-width="4"/>
    </g>
    <g transform="translate(362 288) rotate(8)">
      <rect x="0" y="0" width="84" height="88" rx="28" fill="url(#lenjerSkin)"/>
      <ellipse cx="62" cy="44" rx="22" ry="39" fill="url(#cutFace)" stroke="#BD7B2C" stroke-width="4"/>
    </g>
  </g>

  <!-- Cuko Small Bowl + Diced Cucumber -->
  <g transform="translate(225 322)" filter="url(#sh)">
    <circle cx="0" cy="0" r="46" fill="#2E1C14"/>
    <circle cx="0" cy="-2" r="38" fill="#3B1A0B"/>
    <circle cx="-10" cy="-8" r="3" fill="#C9452C"/>
    <circle cx="10" cy="6" r="2.5" fill="#7EA13D"/>
  </g>
  <g transform="translate(290 326)">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#B2DC8C" stroke="#5A8E3D" stroke-width="2"/>
    <rect x="26" y="-8" width="22" height="20" rx="4" fill="#9ECA75" stroke="#5A8E3D" stroke-width="2"/>
    <rect x="16" y="16" width="22" height="20" rx="4" fill="#BCE398" stroke="#5A8E3D" stroke-width="2"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Telur Kecil">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FCF7F0"/>
      <stop offset="100%" stop-color="#ECE1D0"/>
    </radialGradient>
    <radialGradient id="dish" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#F1E7D7"/>
      <stop offset="100%" stop-color="#D9CBB5"/>
    </radialGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDBA68"/>
      <stop offset="55%" stop-color="#D1913A"/>
      <stop offset="100%" stop-color="#9F611E"/>
    </linearGradient>
    <radialGradient id="yolk" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="100%" stop-color="#DA9214"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#28160C" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="255" r="206" fill="url(#dish)" filter="url(#sh)" stroke="#D8C9B2" stroke-width="3"/>
  <circle cx="400" cy="255" r="168" fill="none" stroke="#7D1E26" stroke-width="1.5" opacity="0.22"/>

  <!-- Whole Mini Telur Kecil #1 (Top Left) -->
  <g transform="translate(318 192) rotate(-22)" filter="url(#sh)">
    <path d="M-56 12 C-54 -28 -22 -52 12 -48 C48 -44 64 -16 60 16 C56 44 28 54 -6 54 C-40 54 -58 38 -56 12 Z" fill="url(#skin)"/>
    <path d="M-32 -20 C-14 -34 14 -34 32 -20" fill="none" stroke="#FCE2AC" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Whole Mini Telur Kecil #2 (Top Right) -->
  <g transform="translate(476 202) rotate(18)" filter="url(#sh)">
    <path d="M-56 12 C-54 -28 -22 -52 12 -48 C48 -44 64 -16 60 16 C56 44 28 54 -6 54 C-40 54 -58 38 -56 12 Z" fill="url(#skin)"/>
    <path d="M-30 -20 C-12 -32 14 -32 30 -18" fill="none" stroke="#FCE2AC" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- Halved Mini Telur Kecil (Bottom Center Hero) -->
  <g transform="translate(396 312) rotate(-4)" filter="url(#sh)">
    <path d="M-74 14 C-70 -36 -30 -66 14 -62 C58 -58 80 -22 76 18 C72 54 38 68 -8 68 C-52 68 -76 48 -74 14 Z" fill="url(#skin)"/>
    <path d="M-58 12 C-55 -24 -24 -48 12 -45 C46 -42 64 -16 60 15 C57 42 30 52 -6 52 C-40 52 -60 37 -58 12 Z" fill="#F5EBD7"/>
    <ellipse cx="4" cy="6" rx="30" ry="26" fill="#FFFDF8"/>
    <circle cx="5" cy="7" r="16" fill="url(#yolk)"/>
  </g>

  <!-- Cuko Splashes & Cucumber Accent -->
  <path d="M350 264 Q395 292 436 270" fill="none" stroke="#3B1A0B" stroke-width="7" stroke-linecap="round" opacity="0.82"/>
  <circle cx="288" cy="316" r="10" fill="#B2DC8C" stroke="#5A8E3D" stroke-width="2"/>
  <circle cx="310" cy="336" r="9" fill="#9BC973" stroke="#5A8E3D" stroke-width="2"/>
  <circle cx="516" cy="316" r="6" fill="#C9452C"/>
  <circle cx="532" cy="306" r="5" fill="#639638"/>
</svg>

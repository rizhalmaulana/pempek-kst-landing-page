<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Kulit Krispi">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FAF4EA"/>
      <stop offset="100%" stop-color="#E7D8C3"/>
    </radialGradient>
    <radialGradient id="kulitGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#B97B42"/>
      <stop offset="55%" stop-color="#8A5226"/>
      <stop offset="100%" stop-color="#5B3314"/>
    </radialGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#28160C" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Parchment-lined Woven Tray -->
  <rect x="125" y="94" width="550" height="316" rx="28" fill="#D9B98B" filter="url(#sh)"/>
  <rect x="148" y="114" width="504" height="276" rx="18" fill="#FAF6EE" stroke="#E2D4BE" stroke-width="2"/>

  <!-- 3 Flat Wavy Crispy Pempek Kulit Discs -->
  <g filter="url(#sh)">
    <!-- Back Disc -->
    <g transform="translate(310 218) rotate(-14)">
      <path d="M-98 -10 C-94 -54 -44 -72 8 -68 C62 -64 104 -38 100 10 C96 54 48 72 -10 68 C-66 64 -102 36 -98 -10 Z" fill="url(#kulitGrad)"/>
      <circle cx="-38" cy="-14" r="10" fill="#D59A5B" opacity="0.45"/>
      <circle cx="24" cy="18" r="12" fill="#46240D" opacity="0.35"/>
      <circle cx="42" cy="-20" r="8" fill="#D59A5B" opacity="0.4"/>
      <ellipse cx="-8" cy="12" rx="8" ry="3" fill="#4A7A32" opacity="0.75"/>
    </g>
    <!-- Middle Right Disc -->
    <g transform="translate(495 224) rotate(12)">
      <path d="M-96 -8 C-92 -52 -42 -70 10 -66 C64 -62 102 -36 98 12 C94 56 46 72 -12 68 C-68 64 -100 36 -96 -8 Z" fill="url(#kulitGrad)"/>
      <circle cx="-26" cy="18" r="11" fill="#D59A5B" opacity="0.42"/>
      <circle cx="32" cy="-12" r="13" fill="#46240D" opacity="0.35"/>
      <circle cx="-46" cy="-18" r="7" fill="#D59A5B" opacity="0.4"/>
      <ellipse cx="14" cy="24" rx="7" ry="3" fill="#4A7A32" opacity="0.75"/>
    </g>
    <!-- Front Center Hero Disc -->
    <g transform="translate(402 304) rotate(-4)">
      <path d="M-106 -10 C-102 -58 -46 -78 12 -74 C68 -70 112 -40 108 12 C104 60 52 78 -12 74 C-72 70 -110 38 -106 -10 Z" fill="url(#kulitGrad)"/>
      <circle cx="-44" cy="-16" r="12" fill="#DC9F5E" opacity="0.45"/>
      <circle cx="36" cy="-18" r="10" fill="#DC9F5E" opacity="0.4"/>
      <circle cx="14" cy="24" r="13" fill="#46240D" opacity="0.35"/>
      <circle cx="-18" cy="12" r="8" fill="#46240D" opacity="0.32"/>
      <ellipse cx="48" cy="14" rx="8" ry="3" transform="rotate(24 48 14)" fill="#4D7E35" opacity="0.8"/>
      <ellipse cx="-52" cy="18" rx="7" ry="3" transform="rotate(-18 -52 18)" fill="#4D7E35" opacity="0.8"/>
    </g>
  </g>

  <!-- Sliced Red & Green Chilies + Cucumber -->
  <g transform="translate(200 326)">
    <rect x="0" y="0" width="22" height="20" rx="4" fill="#B2DC8C" stroke="#5A8E3D" stroke-width="2"/>
    <rect x="26" y="10" width="22" height="20" rx="4" fill="#9BC973" stroke="#5A8E3D" stroke-width="2"/>
    <circle cx="62" cy="16" r="6" fill="#C9452C"/>
    <circle cx="76" cy="26" r="5" fill="#639638"/>
  </g>
</svg>

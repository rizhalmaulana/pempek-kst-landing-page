<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pempek Pistel Kates">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#FCF7F0"/>
      <stop offset="100%" stop-color="#EADEC9"/>
    </radialGradient>
    <linearGradient id="pistelSkin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2C87B"/>
      <stop offset="55%" stop-color="#D79942"/>
      <stop offset="100%" stop-color="#A66722"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#28160C" flood-opacity="0.16"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Maroon-Rimmed Heritage Plate -->
  <ellipse cx="400" cy="258" rx="268" ry="174" fill="#FFFDF9" filter="url(#sh)" stroke="#7D1E26" stroke-width="5"/>
  <ellipse cx="400" cy="258" rx="236" ry="146" fill="none" stroke="#D8B36A" stroke-width="2" opacity="0.65"/>

  <!-- Pistel #1 (Top Left Crescent with Pleated Edge) -->
  <g transform="translate(306 206) rotate(-18)" filter="url(#sh)">
    <path d="M-84 22 C-82 -34 -34 -68 18 -64 C66 -60 94 -22 86 24 C44 38 -38 38 -84 22 Z" fill="url(#pistelSkin)"/>
    <path d="M-78 16 Q-58 -48 16 -56 Q72 -52 80 18" fill="none" stroke="#9C5D1C" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.65"/>
    <path d="M-44 -16 C-16 -34 22 -34 46 -14" fill="none" stroke="#FCE3AE" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Pistel #2 (Top Right Crescent) -->
  <g transform="translate(494 214) rotate(16)" filter="url(#sh)">
    <path d="M-84 22 C-82 -34 -34 -68 18 -64 C66 -60 94 -22 86 24 C44 38 -38 38 -84 22 Z" fill="url(#pistelSkin)"/>
    <path d="M-78 16 Q-58 -48 16 -56 Q72 -52 80 18" fill="none" stroke="#9C5D1C" stroke-width="8" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.65"/>
    <path d="M-44 -16 C-16 -34 22 -34 46 -14" fill="none" stroke="#FCE3AE" stroke-width="4" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Pistel #3 (Front Open Cross-Section showing Papaya & Ebi Filling) -->
  <g transform="translate(400 318) rotate(-3)" filter="url(#sh)">
    <path d="M-96 24 C-94 -38 -38 -78 20 -74 C76 -70 108 -26 98 28 C52 44 -44 44 -96 24 Z" fill="url(#pistelSkin)"/>
    <path d="M-88 18 Q-66 -54 18 -64 Q82 -58 90 22" fill="none" stroke="#9C5D1C" stroke-width="9" stroke-dasharray="11 8" stroke-linecap="round" opacity="0.68"/>
    <!-- Cut Opening revealing Shredded Young Papaya (Kates) & Ebi -->
    <ellipse cx="4" cy="4" rx="54" ry="26" fill="#F8EEDB" stroke="#C48534" stroke-width="3"/>
    <path d="M-34 4 Q-16 -8 4 6 T38 -2 M-28 12 Q-6 2 18 14 T44 6 M-30 -4 Q-4 -14 26 -4" fill="none" stroke="#D9A34E" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-14" cy="4" r="4" fill="#C96A2C"/>
    <circle cx="14" cy="-2" r="4" fill="#B8561F"/>
    <circle cx="24" cy="10" r="3.5" fill="#C96A2C"/>
    <circle cx="-4" cy="12" r="3.5" fill="#5D8F3B"/>
  </g>
</svg>

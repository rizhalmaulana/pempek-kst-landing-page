<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Extra Cuko Kental Botol 250ml">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#3E2519"/>
      <stop offset="100%" stop-color="#1E1009"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#220F07"/>
      <stop offset="28%" stop-color="#4A2310"/>
      <stop offset="55%" stop-color="#2A1208"/>
      <stop offset="100%" stop-color="#170904"/>
    </linearGradient>
    <linearGradient id="label" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D1E26"/>
      <stop offset="100%" stop-color="#531016"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Warm Tabletop Glow -->
  <ellipse cx="400" cy="410" rx="310" ry="54" fill="#0E0603" opacity="0.55"/>

  <!-- Gula Aren Batok Blocks (Left) -->
  <g transform="translate(215 352)" filter="url(#sh)">
    <ellipse cx="0" cy="36" rx="54" ry="20" fill="#3B1A0B"/>
    <rect x="-54" y="-14" width="108" height="50" fill="#592A14"/>
    <ellipse cx="0" cy="-14" rx="54" ry="20" fill="#70381C"/>
  </g>
  <g transform="translate(285 384)" filter="url(#sh)">
    <ellipse cx="0" cy="24" rx="44" ry="16" fill="#3B1A0B"/>
    <rect x="-44" y="-10" width="88" height="34" fill="#633018"/>
    <ellipse cx="0" cy="-10" rx="44" ry="16" fill="#7B3E20"/>
  </g>

  <!-- Sleek Sealed Cuko 250ml Bottle (Center) -->
  <g transform="translate(400 250)" filter="url(#sh)">
    <!-- Cap -->
    <rect x="-24" y="-194" width="48" height="28" rx="6" fill="#181210" stroke="#B8862E" stroke-width="1.5"/>
    <!-- Neck & Shoulders & Body -->
    <path d="M-20 -166 L-20 -104 C-20 -78 -62 -64 -62 -28 L-62 152 C-62 168 -48 178 0 178 C48 178 62 168 62 152 L62 -28 C62 -64 20 -78 20 -104 L20 -166 Z" fill="url(#bottle)" stroke="#5E351F" stroke-width="2"/>
    <!-- Glass Highlight -->
    <path d="M-42 -22 L-42 146" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.16"/>
    <!-- Heritage Songket Label Band -->
    <rect x="-61" y="-8" width="122" height="104" fill="url(#label)"/>
    <line x1="-61" y1="-2" x2="61" y2="-2" stroke="#E7C87B" stroke-width="2"/>
    <line x1="-61" y1="90" x2="61" y2="90" stroke="#E7C87B" stroke-width="2"/>
    <path d="M0 10 L12 22 L0 34 L-12 22 Z" fill="none" stroke="#E7C87B" stroke-width="2"/>
    <text x="0" y="60" text-anchor="middle" fill="#FAF6F0" font-family="Georgia, serif" font-weight="700" font-size="18">CUKO</text>
    <text x="0" y="79" text-anchor="middle" fill="#E7C87B" font-family="sans-serif" font-weight="700" font-size="11" letter-spacing="1.5">250 ML</text>
  </g>

  <!-- Bird's Eye Chilies & Garlic (Right) -->
  <g transform="translate(562 368)" filter="url(#sh)">
    <path d="M-22 10 Q14 -26 56 -6 Q24 22 -22 10 Z" fill="#C93824"/>
    <path d="M-22 10 Q-32 4 -40 12" stroke="#4D7C35" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M-8 34 Q28 4 66 24 Q34 46 -8 34 Z" fill="#5D8F3B"/>
    <path d="M-8 34 Q-18 32 -26 38" stroke="#3F6627" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <!-- Garlic Clove -->
    <ellipse cx="42" cy="-34" rx="24" ry="18" transform="rotate(-18 42 -34)" fill="#F7EFE0" stroke="#D8C7AF" stroke-width="2"/>
  </g>
</svg>
